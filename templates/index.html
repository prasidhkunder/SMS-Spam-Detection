<!DOCTYPE html>
<html>

<head>

    <title>SMS Spam Detection</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📩 SMS Spam Detection</h1>

    <form method="POST">

        <textarea
            name="message"
            placeholder="Enter your SMS here..."
            required>{{ message }}</textarea>

        <button type="submit">

            Predict

        </button>

    </form>

    {% if prediction %}

    <div class="result">

        <h2>{{ prediction }}</h2>

        <p>

            <strong>Confidence :</strong>

            {{ confidence }}%

        </p>

    </div>

    {% endif %}

</div>

</body>

</html>
